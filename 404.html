<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada — Galadriel Music Studio</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4efe6;color:#080705;font:300 1rem/1.6 Inter,system-ui,sans-serif;text-align:center;padding:2rem}
main{width:min(560px,100%);border:5px solid #080705;border-radius:16px;padding:clamp(2rem,7vw,4rem);background:radial-gradient(circle at 50% 20%,#fffaf0,#f4efe6);box-shadow:0 28px 65px rgba(0,0,0,.18)}
.mark{width:52px;height:52px;margin:0 auto 1.4rem;border-radius:50%;background:#080705;display:grid;place-items:center;box-shadow:inset 0 0 0 11px #0e0d0a}
.mark:before{content:"";width:15px;height:15px;border-radius:50%;background:#f4efe6;box-shadow:0 0 0 2px #b99146}
h1{margin:0 0 .8rem;font:700 clamp(2.4rem,8vw,4.4rem)/.86 "Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em}
p{margin:0;color:rgba(8,7,5,.58)}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:1.5rem;padding:0 1.4rem;border-radius:999px;background:#080705;color:#f4efe6;text-decoration:none;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true"></span>
  <h1>Página no encontrada</h1>
  <p>El enlace puede estar mal escrito o ya no estar disponible.</p>
  <a href="/music/">Volver a canales</a>
</main>
</body>
</html>
